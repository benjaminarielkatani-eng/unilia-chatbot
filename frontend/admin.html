<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F4F7FB">
    <title>Admin Dashboard | UNILIA AI</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <main class="admin-login" id="adminLogin">
        <form class="panel login-panel" id="adminLoginForm" method="post">
            <img class="login-logo" src="images/unilia-logo.png" alt="University of Livingstonia">
            <h1>Admin sign in</h1>
            <p>Sign in to manage the UNILIA helpdesk.</p>
            <div class="admin-field">
                <label for="adminUsername">Username</label>
                <input id="adminUsername" name="username" autocomplete="username" required>
            </div>
            <div class="admin-field">
                <label for="adminPassword">Password</label>
                <input id="adminPassword" name="password" type="password" autocomplete="current-password" required>
            </div>
            <p class="form-error" id="adminLoginMessage" role="status" hidden></p>
            <button class="button button-primary" id="signInButton" type="submit">Sign in</button>
            <a class="login-back" href="index.html">Return to student site</a>
        </form>
    </main>

    <div class="admin-shell" id="adminShell" hidden>
        <aside class="admin-sidebar" id="adminSidebar" aria-label="Administrator navigation">
            <a class="admin-brand" href="admin.html" aria-label="UNILIA AI administration">
                <span class="brand-mark" aria-hidden="true"><img src="images/unilia-logo.png" alt=""></span>
                <span class="brand-copy"><strong>UNILIA AI</strong><small>Administration</small></span>
            </a>

            <div class="sidebar-label">WORKSPACE</div>
            <nav class="admin-nav" aria-label="Dashboard sections">
                <button class="nav-item is-active" type="button" data-view="overview" title="Dashboard Overview" aria-current="page">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg><span>Dashboard Overview</span>
                </button>
                <button class="nav-item" type="button" data-view="users" title="User Management">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>User Management</span>
                </button>
                <button class="nav-item" type="button" data-view="documents" title="Document Management">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg><span>Document Management</span>
                </button>
                <button class="nav-item" type="button" data-view="feedback" title="Feedback &amp; Reviews">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/><path d="m8 12 2.5 2.5L16 9"/></svg><span>Feedback &amp; Reviews</span>
                </button>
                <button class="nav-item" type="button" data-view="analytics" title="Analytics &amp; Reports">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-5 5"/><path d="M17 9h2v2"/></svg><span>Analytics &amp; Reports</span>
                </button>
                <button class="nav-item" type="button" data-view="settings" title="System Settings">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.5.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.5-.9l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.8L6.9 12l1.4-2.4 1.7.6a8 8 0 0 1 1.5-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.5.9l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.9z"/></svg><span>System Settings</span>
                </button>
                <button class="nav-item" type="button" data-view="profile" title="My Profile">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><span>My Profile</span>
                </button>
            </nav>

            <div class="sidebar-bottom">
                <button class="nav-item logout-link" id="adminSignOut" type="button" title="Sign out">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg><span>Sign out</span>
                </button>
                <button class="collapse-button" id="collapseSidebar" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>Collapse menu</span>
                </button>
            </div>
        </aside>

        <div class="sidebar-scrim" id="sidebarScrim"></div>
        <main class="admin-main">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="icon-button mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Open navigation menu" aria-expanded="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <div class="breadcrumb"><span>UNILIA AI</span><span class="breadcrumb-separator">/</span><strong id="currentSection">Dashboard Overview</strong></div>
                </div>
                <div class="topbar-actions">
                    <label class="global-search">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                        <input id="globalSearch" type="search" placeholder="Search this view..." aria-label="Search current dashboard view">
                        <kbd>/</kbd>
                    </label>
                    <div class="notification-wrap">
                        <button class="icon-button notification-button" id="notificationButton" type="button" aria-label="Notifications" aria-expanded="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span class="notification-indicator"></span>
                        </button>
                        <section class="notification-popover" id="notificationPopover" hidden aria-label="Notifications">
                            <div class="popover-heading"><strong>Notifications</strong></div>
                            <p class="notification-empty" id="notificationMessage"></p>
                            <button class="row-action" id="notificationFeedback" type="button">Open feedback</button>
                        </section>
                    </div>
                    <div class="admin-profile" style="cursor:pointer" data-view="profile" title="My Profile" role="button" tabindex="0">
                        <span class="admin-avatar" id="adminInitials" aria-hidden="true">AD</span>
                        <span class="profile-copy"><strong id="adminProfileName"></strong><small>Administrator</small></span>
                    </div>
                </div>
            </header>

            <div class="page-content" id="pageContent" tabindex="-1"></div>
            <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
        </main>
    </div>

    <dialog class="detail-dialog" id="detailDialog" aria-labelledby="dialogTitle">
        <div class="dialog-content" id="dialogContent"></div>
    </dialog>

    <script src="admin.js"></script>
</body>
</html>
