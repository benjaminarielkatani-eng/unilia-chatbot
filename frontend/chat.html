
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UNILIA AI - Student Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-layout" id="chatLayout">

        <aside class="chat-sidebar" id="chatSidebar" aria-label="Chat navigation">
            <a class="chat-sidebar-brand" href="index.html" aria-label="UNILIA AI home">
                <img src="images/unilia-logo.png" alt="" class="chat-sidebar-logo">
                <span class="chat-sidebar-brand-copy"><strong>UNILIA AI</strong><small>Student Assistant</small></span>
            </a>
            <button type="button" class="mobile-sidebar-close" id="mobileSidebarCloseButton" aria-label="Close navigation">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <path d="m18 6-12 12M6 6l12 12"></path>
                </svg>
            </button>

            <button type="button" class="new-chat-button" id="newChatButton" title="New chat" data-tooltip="New chat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"></path>
                </svg>
                <span>New chat</span>
            </button>

            <nav class="nav-links" aria-label="Main navigation">
                <a href="index.html" class="nav-link" title="Home" aria-label="Home" data-tooltip="Home">
                    <span class="nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m3 11 9-8 9 8"></path><path d="M5 10v10h14V10"></path><path d="M9 20v-6h6v6"></path>
                        </svg>
                    </span>
                    <span class="nav-label">Home</span>
                </a>

                <a href="index.html#topics" class="nav-link" title="Explore Topics" aria-label="Explore Topics" data-tooltip="Explore topics">
                    <span class="nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path>
                        </svg>
                    </span>
                    <span class="nav-label">Explore topics</span>
                </a>

                <button type="button" id="recentQuestionsButton" class="nav-link is-active" title="Recent Conversations" aria-label="Recent Conversations" aria-expanded="false" data-tooltip="Recent conversations">
                    <span class="nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"></path><path d="M8 9h8M8 13h5"></path>
                        </svg>
                    </span>
                    <span class="nav-label">Recent conversations</span>
                </button>

                <a href="index.html#about" class="nav-link" title="About UNILIA AI" aria-label="About UNILIA AI" data-tooltip="About UNILIA AI">
                    <span class="nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path>
                        </svg>
                    </span>
                    <span class="nav-label">About UNILIA AI</span>
                </a>
            </nav>

            <section class="conversation-history" aria-label="Recent conversations">
                <div class="conversation-history-heading">
                    <h2>Recent conversations</h2>
                    <label class="conversation-search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path>
                        </svg>
                        <input id="conversationSearch" type="search" placeholder="Search conversations" aria-label="Search conversations">
                    </label>
                </div>
                <div class="conversation-list" id="conversationList"></div>
            </section>

            <div class="sidebar-bottom">
                <a href="index.html" class="profile-navigation" title="Student profile and home page" data-tooltip="Student profile">
                    <span class="profile-avatar chat-profile-avatar" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path>
                        </svg>
                    </span>
                    <span class="profile-navigation-label">Student profile</span>
                </a>
                <button type="button" class="sidebar-collapse-button" id="sidebarCollapseButton" aria-label="Collapse sidebar" title="Collapse sidebar" data-tooltip="Collapse sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m15 18-6-6 6-6"></path>
                    </svg>
                    <span>Collapse sidebar</span>
                </button>
            </div>
        </aside>

        <button type="button" class="chat-sidebar-scrim" id="chatSidebarScrim" aria-label="Close navigation" tabindex="-1"></button>

        <main class="chat-page">

        <!-- CHAT HEADER -->
        <header class="chat-header">
            <div class="chat-brand">
                <button type="button" class="mobile-sidebar-button" id="mobileSidebarButton" aria-label="Open navigation" aria-expanded="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <path d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <img
                    class="chat-logo"
                    src="images/unilia-logo.png"
                    alt="University of Livingstonia logo"
                >

                <div class="chat-brand-text">
                    <p>University of Livingstonia</p>
                </div>
            </div>

        </header>


        <!-- CONVERSATION AREA -->
        <section class="chat-messages" id="chatMessages" role="log" aria-live="off" aria-relevant="additions text" tabindex="0">

            <!-- Messages will appear here -->

        </section>


        <!-- QUESTION INPUT AREA -->
        <div class="chat-composer-area">
        <form class="chat-input-form" id="questionForm">

            <!-- PAPERCLIP -->
            <label
                for="fileInput"
                class="chat-icon-button"
                title="Attach a document"
                aria-label="Attach a document">

                <svg
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>

                </svg>

            </label>

            <input
                type="file"
                id="fileInput"
                accept=".pdf,.doc,.docx,.txt"
                hidden
            >


            <!-- QUESTION INPUT -->
            <textarea
                id="questionInput"
                placeholder="Type your question here..."
                autocomplete="off"
                rows="1"
                aria-label="Type your question"
                required
            ></textarea>


            <!-- EMOJI BUTTON -->
            <button
                type="button"
                id="emojiButton"
                class="chat-icon-button"
                title="Choose emoji"
                aria-label="Choose emoji"
                aria-expanded="false">

                ☺

            </button>


            <!-- MICROPHONE BUTTON -->
            <button
                type="button"
                id="micButton"
                class="chat-icon-button"
                title="Use voice input"
                aria-label="Use voice input"
                aria-pressed="false">

                <svg
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                    <path d="M5 10v2a7 7 0 0 0 14 0v-2"></path>
                    <path d="M12 19v3"></path>
                    <path d="M8 22h8"></path>

                </svg>

            </button>


            <!-- SEND BUTTON -->
            <button
                type="submit"
                class="send-button"
                aria-label="Send message"
                title="Send message">

                <svg
                    viewBox="0 0 24 24"
                    width="21"
                    height="21"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M22 2L11 13"></path>
                    <path d="M22 2L15 22L11 13L2 9L22 2"></path>

                </svg>

            </button>

        </form>


        <!-- EMOJI PICKER -->
        <div id="emojiPicker" class="emoji-picker" role="group" aria-label="Emoji picker" hidden>

            <button type="button">😊</button>
            <button type="button">👍</button>
            <button type="button">❤️</button>
            <button type="button">🎓</button>
            <button type="button">📚</button>
            <button type="button">😂</button>

        </div>


        <!-- SELECTED FILE NAME -->
        <p id="fileName" class="file-name" aria-live="polite"></p>
        <p class="attachment-disclaimer">Attachments are selected in this browser only; file contents are not uploaded or analyzed.</p>
        </div>

        </main>

    </div>

    <div class="chat-toast-region" id="chatToastRegion" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- JAVASCRIPT CONNECTION -->
    <script src="chat.js"></script>

</body>

</html>
